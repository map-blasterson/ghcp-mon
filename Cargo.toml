[package]
name = "ghcp-mon"
version = "0.0.9"
edition = "2021"
description = "Local-first GitHub Copilot CLI telemetry collector + dashboard backend."
license = "MIT"
repository = "https://github.com/map-blasterson/ghcp-mon"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json", "chrono"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
rust-embed = "8"
mime_guess = "2"
serde_yaml_ng = "0.10.0"
ratatui = "0.30"
crossterm = "0.29"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
toml = "0.8"
dirs = "5"
tracing-appender = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rand = "0.8"
assert_matches = "1.5.0"

[profile.release]
lto = "thin"

# ---- Debian packaging (cargo-deb) -------------------------------------------
# Built by `scripts/deb.sh` via the `deb` stage in Containerfile. amd64 only.
# Ships a *user* systemd unit; postinst deliberately does not enable it.
[package.metadata.deb]
maintainer = "Map Blasterson <mabeltma@microsoft.com>"
copyright = "2026 Map Blasterson"
license-file = ["LICENSE", "0"]
extended-description = """\
ghcp-mon ingests OTLP telemetry from the GitHub Copilot CLI into a local
SQLite database and serves a dashboard REST API + WebSocket. This package
installs ghcp-mon as a per-user systemd service (not enabled by default)."""
section = "utils"
priority = "optional"
depends = "$auto, systemd"
maintainer-scripts = "debian/"
conf-files = ["/etc/default/ghcp-mon"]
assets = [
    ["target/release/ghcp-mon",        "usr/bin/",                                  "755"],
    ["debian/ghcp-mon.service",        "usr/lib/systemd/user/ghcp-mon.service",     "644"],
    ["debian/default",                 "etc/default/ghcp-mon",                      "644"],
    ["README.md",                      "usr/share/doc/ghcp-mon/README",             "644"],
]
